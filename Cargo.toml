[package]
name = "rhymr-rs"
version = "2026.1.0"
edition = "2024"

[dependencies]
# GTK & GNOME ecosystem
gtk = { version = "0.11.4", package = "gtk4", features = ["v4_16"] }
sourceview5 = { version = "0.11.2", features = ["gtk_v4_12"] }
glib = { version = "0.22.8" }
gio = { version = "0.22.8" }

# SCSS -> CSS
grass = { version = "0.13.4" }

# Git integration (pure Rust bindings) — ssh/https needed for actual network
# transport (push/pull/fetch), and pull in the credential-helper API.
git2 = { version = "0.21.0", features = ["ssh", "https"] }
dirs = "6.0.0"

# Diagnostics — the `log` facade only; a ~30-line stderr logger lives in
# `src/logging.rs` (no env_logger/tracing, to keep the dep tree lean).
log = { version = "0.4", features = ["std"] }

# JSON config/cache (Apple Notes snapshot in the workspace's .rhymr/)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Futures & Async
futures-channel = { version = "0.3.33" }
futures-util = { version = "0.3.33" }
tokio = { version = "1.53.1", features = ["full"] }

# Rhyme Search API
datamuse-api-rs = { version = "2.1.2" }

# Completions, syllable counting & rhyme highlighting
fancy-regex = { version = "0.13" }
cmudict-fast = { version = "0.8.0" }
rphonetic = { version = "3.0.6" }
hypher = { version = "0.1.7", default-features = false, features = ["alloc", "english"] }
libadwaita = { version = "0.9.2", features = ["v1_4"] }

[build-dependencies]
glib-build-tools = { version = "0.22.8" }
grass = { version = "0.13.4" }
